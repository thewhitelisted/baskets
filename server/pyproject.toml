[project]
name = "baskets-server"
version = "0.1.0"
description = "Data API for Baskets: fetches, caches and serves price series and metadata."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "yfinance",
    "pandas",
    "slowapi",
]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "mypy",
    "ruff",
    "pandas-stubs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "ANN", "BLE", "PT"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
